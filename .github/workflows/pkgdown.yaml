# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches:
      - main
    paths:
      - r-package/**
      - .github/workflows/pkgdown.yaml
  # rebuild the site by hand, e.g. after a data server was down during a build
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # never run two deploys at the same time
    concurrency:
      group: pkgdown-${{ github.ref }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # build the articles with data (maps), see vignettes' setup chunks
      NOT_CRAN: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
          working-directory: r-package

      - name: Build and deploy pkgdown site
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'
        working-directory: r-package
